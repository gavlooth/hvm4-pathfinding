<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maritime Router — Aegean Sea</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; }
    #map { width: 100vw; height: 65vh; }
    #panel { padding: 12px 24px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    #status { flex: 1; min-width: 220px; }
    #status h2 { color: #4fc3f7; margin-bottom: 6px; font-size: 17px; }
    #status .info { font-size: 13px; line-height: 1.7; color: #aaa; }
    #status .info b { color: #e0e0e0; }
    #controls { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
    #controls label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    #controls select, #controls button, #controls input {
      padding: 7px 12px; border: 1px solid #333; border-radius: 5px;
      background: #1a1a2e; color: #e0e0e0; font-size: 13px; cursor: pointer;
    }
    #controls input { cursor: text; width: 100%; }
    #controls select:focus, #controls input:focus { border-color: #4fc3f7; outline: none; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; }
    #btn-route { background: #e94560; border-color: #e94560; font-weight: 600; }
    #btn-route:hover { background: #c73850; }
    #btn-route:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-cancel { background: #333; border-color: #555; font-weight: 600; display: none; }
    #btn-cancel:hover { background: #555; }
    #log { flex: 1; min-width: 200px; font-size: 12px; color: #666; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.6; }
    #log .ok { color: #4caf50; }
    #log .err { color: #e94560; }
    #log .warn { color: #ffb74d; }
    #wp-table { max-height: 30vh; overflow-y: auto; width: 100%; padding: 0 24px 16px; }
    #wp-table table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: monospace; }
    #wp-table th { position: sticky; top: 0; background: #0a0a1a; color: #4fc3f7; text-align: left; padding: 4px 8px; border-bottom: 1px solid #333; }
    #wp-table td { padding: 3px 8px; border-bottom: 1px solid #1a1a2e; }
    #wp-table tr:hover td { background: #1a1a2e; }
    .algo-desc { font-size: 11px; color: #555; margin-top: 2px; min-height: 28px; line-height: 1.4; }
    .timeout-row { display: flex; align-items: center; gap: 6px; }
    .timeout-row input { width: 50px; text-align: center; padding: 5px 4px; }
    .timeout-row span { font-size: 12px; color: #666; }
    .elapsed { font-size: 12px; color: #ffb74d; font-family: monospace; min-height: 18px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="status">
      <h2>Maritime Router</h2>
      <div class="info" id="info">Select a route and algorithm, then click "Route".</div>
    </div>
    <div id="controls">
      <label>Route</label>
      <select id="route-select">
        <option value="37.9475,23.6378,37.4467,25.3289" selected>Piraeus - Mykonos</option>
        <option value="37.9475,23.6378,36.3932,25.4615">Piraeus - Santorini</option>
        <option value="37.9475,23.6378,35.3387,25.1442">Piraeus - Heraklion</option>
        <option value="40.6401,22.9444,38.3722,26.1367">Thessaloniki - Chios</option>
        <option value="39.3666,22.9425,39.1622,23.4903">Volos - Skiathos</option>
        <option value="36.4510,28.2278,37.9475,23.6378">Rhodes - Piraeus</option>
        <option value="40.9397,24.4014,39.8742,25.0636">Kavala - Limnos</option>
        <option value="38.2466,21.7346,39.6243,19.9217">Patras - Corfu</option>
      </select>
      <label>Algorithm</label>
      <select id="algo" disabled>
        <option value="c3_dijkstra" selected>Dijkstra (C3)</option>
        <option value="vine_dijkstra">Dijkstra (Vine)</option>
        <option value="vine_delta_stepping">Delta-Stepping (Vine, parallel)</option>
        <option value="vine_bfs">BFS (Vine)</option>
        <option value="vine_bellman_ford">Bellman-Ford (Vine)</option>
      </select>
      <label>Smoothing</label>
      <select id="smoothing" onchange="onSmoothingChange()">
        <option value="none">None (raw waypoints)</option>
        <option value="chaikin" selected>Chaikin corner cutting</option>
        <option value="bezier">Cubic B&eacute;zier spline</option>
        <option value="heading">Heading-rate limiting</option>
      </select>
      <label>Timeout</label>
      <div class="timeout-row">
        <input type="number" id="timeout" value="30" min="5" max="300" step="5">
        <span>seconds</span>
      </div>
      <div class="elapsed" id="elapsed"></div>
      <div class="btn-row">
        <button id="btn-route" onclick="runPipeline()">Route</button>
        <button id="btn-cancel" onclick="cancelPipeline()">Cancel</button>
      </div>
    </div>
    <div id="log"></div>
  </div>
  <div id="wp-table"></div>

<script>
const API = location.origin;
let map, routeLine, markers = [];
let abortCtrl = null;
let elapsedTimer = null;
let bgLine = null;

const ALGO_INFO = {
  'c3_dijkstra': { name: 'Dijkstra (C3)', desc: 'Fibonacci heap Dijkstra in C3.' },
  'vine_dijkstra': { name: 'Dijkstra (Vine)', desc: 'Map-based Dijkstra on IVM runtime.' },
  'vine_delta_stepping': { name: 'Delta-Stepping (Vine)', desc: 'Parallel bucket SSSP — atomic dist/prev in Rust, tree-parallel relaxation. 53x faster than Vine Dijkstra.' },
  'vine_bfs': { name: 'BFS (Vine)', desc: 'Level-synchronous BFS (unweighted) on IVM.' },
  'vine_bellman_ford': { name: 'Bellman-Ford (Vine)', desc: 'Edge relaxation with early termination on IVM.' },
};

function onSmoothingChange() {
  if (lastRoute) {
    displayRoute(lastRoute);
    updateInfo(lastRoute, lastAlg, lastMs);
  }
}

let lastRoute = null, lastAlg = '', lastMs = 0;

// --- Map setup ---
map = L.map('map').setView([37.8, 24.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

// --- Logging ---
function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls || ''}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// --- Elapsed timer ---
function startElapsed() {
  const start = performance.now();
  const el = document.getElementById('elapsed');
  el.textContent = '0.0s';
  elapsedTimer = setInterval(() => {
    const s = ((performance.now() - start) / 1000).toFixed(1);
    el.textContent = `${s}s elapsed`;
  }, 100);
}

function stopElapsed() {
  clearInterval(elapsedTimer);
  elapsedTimer = null;
}

// --- API helpers ---
async function post(path, body, signal) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal,
  });
  if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);
  return res.json();
}

// --- Cancel ---
function cancelPipeline() {
  if (abortCtrl) {
    abortCtrl.abort();
    log('Cancelled by user', 'warn');
  }
}

function setRunning(running) {
  document.getElementById('btn-route').style.display = running ? 'none' : '';
  document.getElementById('btn-cancel').style.display = running ? '' : 'none';
  document.getElementById('route-select').disabled = running;
  document.getElementById('algo').disabled = running;
  document.getElementById('timeout').disabled = running;
}

// --- Pipeline ---
async function runPipeline() {
  setRunning(true);
  document.getElementById('log').innerHTML = '';
  document.getElementById('wp-table').innerHTML = '';
  document.getElementById('elapsed').textContent = '';

  abortCtrl = new AbortController();
  const signal = abortCtrl.signal;
  const alg = document.getElementById('algo').value;
  const isVine = alg.startsWith('vine_');
  const userTimeout = parseInt(document.getElementById('timeout').value) || 30;
  const timeoutSec = isVine ? Math.max(userTimeout, 120) : userTimeout;

  // Auto-abort after timeout
  const timeoutId = setTimeout(() => {
    if (abortCtrl) {
      abortCtrl.abort();
      log(`Timeout: algorithm exceeded ${timeoutSec}s limit`, 'err');
    }
  }, timeoutSec * 1000);

  try {
    const sel = document.getElementById('route-select').value.split(',').map(Number);
    const origin = [sel[0], sel[1]], dest = [sel[2], sel[3]];
    // 1. Init
    log('Initializing with H3 graph...');
    const t0 = performance.now();
    const init = await post('/api/init', { ship_speed: 15, max_wave: 4, graph_mode: 'h3' }, signal);
    log(`Initialized: ${init.node_count} nodes (${(performance.now()-t0)|0} ms)`, 'ok');

    // 2. Voyage
    const routeName = document.getElementById('route-select').selectedOptions[0].text;
    log(`Voyage: ${routeName}`);
    await post('/api/voyage', { origin, destination: dest }, signal);

    // 3. Weather (only for C3 algorithms)
    if (!isVine) {
      const n = 25;
      const wxBase = {
        sw: [34.5, 19.0], ne: [41.5, 30.0], rows: 5, cols: 5,
        wind_speed: Array(n).fill(3), wind_dir: Array(n).fill(180),
        wave_height: Array(n).fill(0.5), wave_dir: Array(n).fill(180),
        current_speed: Array(n).fill(0.2), current_dir: Array(n).fill(90),
      };
      await post('/api/weather', { ...wxBase, timestamp: 0 }, signal);
      log('Weather pushed', 'ok');
    }

    // 4. Route
    const algName = ALGO_INFO[alg]?.name || alg;
    log(`Routing with ${algName}... (timeout: ${timeoutSec}s)${isVine ? ' [IVM]' : ''}`);
    startElapsed();
    const t1 = performance.now();

    let route;
    if (isVine) {
      const vineAlgo = alg.replace('vine_', '');
      route = await post('/api/vine/route', { algorithm: vineAlgo, workers: 4, origin, destination: dest }, signal);
    } else {
      route = await post('/api/route', { algorithm: 0 }, signal);
    }
    stopElapsed();
    const ms = (performance.now()-t1)|0;
    document.getElementById('elapsed').textContent = `${(ms/1000).toFixed(1)}s`;
    const costUnit = route.engine === 'vine' ? 'km' : 'h';
    log(`Route: cost=${route.cost} (${route.cost_real.toFixed(1)} ${costUnit}), ${route.path_length} wp, ${ms} ms`, 'ok');

    lastRoute = route;
    lastAlg = algName;
    lastMs = ms;
    displayRoute(route);
    updateInfo(route, algName, ms);

  } catch (e) {
    stopElapsed();
    if (e.name === 'AbortError') {
      log('Request aborted', 'warn');
    } else {
      log(`Error: ${e.message}`, 'err');
      console.error(e);
    }
  } finally {
    clearTimeout(timeoutId);
    abortCtrl = null;
    setRunning(false);
  }
}

function displayRoute(route) {
  if (routeLine) map.removeLayer(routeLine);
  if (bgLine) map.removeLayer(bgLine);
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  bgLine = null;

  const wps = route.waypoints;
  if (!wps || !wps.length) return;

  const method = document.getElementById('smoothing').value;
  const rawLatLngs = wps.map(w => [w.lat, w.lon]);
  const smoothed = smoothRoute(rawLatLngs, method);
  const isSmoothed = method !== 'none';

  // Draw raw route as faint background when smoothing is active
  if (isSmoothed) {
    bgLine = L.polyline(rawLatLngs, { color: '#4fc3f7', weight: 1, opacity: 0.25, dashArray: '4,4' }).addTo(map);
  }

  // Draw smoothed (or raw) route
  routeLine = L.polyline(smoothed, { color: '#e94560', weight: 3, opacity: 0.9, smoothFactor: 1 }).addTo(map);

  // Markers always on original waypoints
  wps.forEach((wp, i) => {
    const isEnd = (i === 0 || i === wps.length - 1);
    const m = L.circleMarker([wp.lat, wp.lon], {
      radius: isEnd ? 7 : 3,
      fillColor: isEnd ? '#e94560' : '#4fc3f7',
      fillOpacity: isEnd ? 1 : 0.6,
      color: '#fff',
      weight: isEnd ? 2 : 1,
    }).addTo(map);
    m.bindPopup(`<b>${i === 0 ? 'Origin' : i === wps.length-1 ? 'Destination' : 'WP ' + i}</b><br>
      Node ${wp.node_id}<br>
      ${wp.lat.toFixed(4)}, ${wp.lon.toFixed(4)}<br>
      ETA: ${wp.eta_hours.toFixed(1)} h | ${wp.speed_knots.toFixed(1)} kt<br>
      Wave: ${wp.wave_height.toFixed(1)} m | Wind: ${wp.wind_speed.toFixed(1)} kt<br>
      Hdg: ${wp.heading_deg.toFixed(0)}&deg;`);
    markers.push(m);
  });

  map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
}

function updateInfo(route, alg, ms) {
  const wps = route.waypoints;

  let totalDist = 0;
  for (let i = 1; i < wps.length; i++) {
    totalDist += haversineNm(wps[i-1].lat, wps[i-1].lon, wps[i].lat, wps[i].lon);
  }

  const method = document.getElementById('smoothing').value;
  const smoothLabel = method === 'none' ? '' : ` + ${method}`;

  document.getElementById('info').innerHTML =
    `<b>Algorithm:</b> ${alg} (${ms} ms)<br>` +
    `<b>Cost:</b> ${route.cost} (${route.cost_real.toFixed(2)} ${route.engine === 'vine' ? 'km' : 'hours'})<br>` +
    `<b>Waypoints:</b> ${wps.length}${smoothLabel}<br>` +
    `<b>Distance:</b> ~${totalDist.toFixed(1)} nm<br>` +
    `<b>ETA:</b> ${wps[wps.length-1].eta_hours.toFixed(1)} hours`;

  let html = '<table><tr><th>#</th><th>Lat</th><th>Lon</th><th>ETA</th><th>Speed</th><th>Wave</th><th>Wind</th><th>Hdg</th><th>Node</th></tr>';
  wps.forEach((wp, i) => {
    html += `<tr>
      <td>${i+1}</td><td>${wp.lat.toFixed(4)}</td><td>${wp.lon.toFixed(4)}</td>
      <td>${wp.eta_hours.toFixed(1)}h</td><td>${wp.speed_knots.toFixed(1)}kt</td>
      <td>${wp.wave_height.toFixed(1)}m</td><td>${wp.wind_speed.toFixed(1)}</td>
      <td>${wp.heading_deg.toFixed(0)}&deg;</td><td>${wp.node_id}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('wp-table').innerHTML = html;
}

// ============================================================
// Smoothing algorithms
// ============================================================

function smoothRoute(pts, method) {
  if (pts.length < 3 || method === 'none') return pts;
  switch (method) {
    case 'chaikin':  return chaikinSmooth(pts, 3);
    case 'bezier':   return catmullRomSpline(pts, 8, 0.5);
    case 'heading':  return headingRateSmooth(pts, 15);
    default:         return pts;
  }
}

// --- Chaikin corner cutting (land-constrained) ---
// Each iteration replaces interior segments with 25%/75% splits.
// After smoothing, each point is clamped so it cannot deviate more
// than maxDev from the nearest segment of the original polyline.
function chaikinSmooth(pts, iterations, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  let points = pts.slice();
  for (let iter = 0; iter < iterations; iter++) {
    const next = [points[0]];
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      if (i === 0) {
        next.push(a);
        next.push([0.5 * a[0] + 0.5 * b[0], 0.5 * a[1] + 0.5 * b[1]]);
      } else if (i === points.length - 2) {
        next.push([0.5 * a[0] + 0.5 * b[0], 0.5 * a[1] + 0.5 * b[1]]);
        next.push(b);
      } else {
        next.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]]);
        next.push([0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
      }
    }
    next.push(points[points.length - 1]);
    points = next;
  }
  // Clamp: pull back any point that drifts too far from the original polyline
  return clampToPolyline(points, pts, maxDev);
}

// --- Catmull-Rom cubic spline (land-constrained) ---
// Passes through all original waypoints with smooth C1 continuity.
// Per-segment deviation is clamped so the spline cannot swing far
// from the original polyline (prevents cutting through islands).
// maxDev: absolute max deviation in degrees (~0.015 deg ≈ 1.7 km).
// Also capped at 20% of chord length so short coastal hops stay tight.
function catmullRomSpline(pts, samplesPerSeg, tension, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  const n = pts.length;
  if (n < 2) return pts;
  const result = [];

  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(n - 1, i + 2)];

    const chordLen = Math.sqrt((p2[0]-p1[0])**2 + (p2[1]-p1[1])**2);
    const segMaxDev = Math.min(maxDev, chordLen * 0.2);

    // Binary search for safe tension: start at full, halve until deviation fits
    let safeTension = tension;
    let segPoints = null;

    for (let attempt = 0; attempt < 6; attempt++) {
      segPoints = hermiteSegment(p0, p1, p2, p3, safeTension, samplesPerSeg);
      const dev = maxChordDeviation(segPoints, p1, p2);
      if (dev <= segMaxDev || safeTension < 0.01) break;
      safeTension *= 0.5;
    }

    // Append segment points (excluding last to avoid duplicates)
    for (let s = 0; s < segPoints.length - 1; s++) {
      result.push(segPoints[s]);
    }
  }
  result.push(pts[n - 1]);
  return result;
}

// Generate Hermite spline points for one segment
function hermiteSegment(p0, p1, p2, p3, t, steps) {
  const m1lat = t * (p2[0] - p0[0]);
  const m1lon = t * (p2[1] - p0[1]);
  const m2lat = t * (p3[0] - p1[0]);
  const m2lon = t * (p3[1] - p1[1]);
  const pts = [];
  for (let s = 0; s <= steps; s++) {
    const u = s / steps;
    const u2 = u * u, u3 = u2 * u;
    const h00 = 2*u3 - 3*u2 + 1;
    const h10 = u3 - 2*u2 + u;
    const h01 = -2*u3 + 3*u2;
    const h11 = u3 - u2;
    pts.push([
      h00*p1[0] + h10*m1lat + h01*p2[0] + h11*m2lat,
      h00*p1[1] + h10*m1lon + h01*p2[1] + h11*m2lon,
    ]);
  }
  return pts;
}

// Max perpendicular distance from any point in pts to the chord a-b
function maxChordDeviation(pts, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx*dx + dy*dy;
  let maxD = 0;
  for (const p of pts) {
    let d;
    if (len2 < 1e-18) {
      d = Math.sqrt((p[0]-a[0])**2 + (p[1]-a[1])**2);
    } else {
      const t = Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2));
      const proj = [a[0] + t*dx, a[1] + t*dy];
      d = Math.sqrt((p[0]-proj[0])**2 + (p[1]-proj[1])**2);
    }
    if (d > maxD) maxD = d;
  }
  return maxD;
}

// --- Heading-rate smoothing (land-constrained) ---
// Maritime-specific: limits the rate of heading change per step.
// Sharp turns are replaced with smooth arcs using quadratic Bezier
// interpolation around the corner waypoint. Final result clamped
// to stay near the original polyline.
function headingRateSmooth(pts, maxTurnDeg, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  const n = pts.length;
  if (n < 3) return pts;
  const result = [pts[0]];

  for (let i = 1; i < n - 1; i++) {
    const prev = pts[i - 1];
    const curr = pts[i];
    const next = pts[i + 1];

    const hdg1 = bearing(prev, curr);
    const hdg2 = bearing(curr, next);
    let turn = hdg2 - hdg1;
    while (turn > 180) turn -= 360;
    while (turn < -180) turn += 360;

    if (Math.abs(turn) <= maxTurnDeg) {
      result.push(curr);
    } else {
      const nSteps = Math.max(3, Math.ceil(Math.abs(turn) / maxTurnDeg));
      const pullback = 0.3;
      const dPrev = Math.sqrt((curr[0]-prev[0])**2 + (curr[1]-prev[1])**2);
      const dNext = Math.sqrt((next[0]-curr[0])**2 + (next[1]-curr[1])**2);
      const rPrev = Math.min(pullback, 0.5 * dPrev / Math.max(dPrev, 1e-9));
      const rNext = Math.min(pullback, 0.5 * dNext / Math.max(dNext, 1e-9));
      const arcStart = [
        curr[0] - rPrev * (curr[0] - prev[0]),
        curr[1] - rPrev * (curr[1] - prev[1]),
      ];
      const arcEnd = [
        curr[0] + rNext * (next[0] - curr[0]),
        curr[1] + rNext * (next[1] - curr[1]),
      ];
      result.push(arcStart);
      for (let s = 1; s < nSteps; s++) {
        const t = s / nSteps;
        const omt = 1 - t;
        result.push([
          omt*omt*arcStart[0] + 2*omt*t*curr[0] + t*t*arcEnd[0],
          omt*omt*arcStart[1] + 2*omt*t*curr[1] + t*t*arcEnd[1],
        ]);
      }
      result.push(arcEnd);
    }
  }
  result.push(pts[n - 1]);
  return clampToPolyline(result, pts, maxDev);
}

// --- Land-avoidance: clamp smoothed points to original polyline ---
// For each smoothed point, find the closest point on the original polyline.
// If distance exceeds maxDev, pull the point back toward the polyline.
function clampToPolyline(smoothed, original, maxDev) {
  return smoothed.map(p => {
    let minD = Infinity, closest = p;
    for (let j = 0; j < original.length - 1; j++) {
      const a = original[j], b = original[j + 1];
      const proj = projectToSegment(p, a, b);
      const d = Math.sqrt((p[0]-proj[0])**2 + (p[1]-proj[1])**2);
      if (d < minD) { minD = d; closest = proj; }
    }
    if (minD <= maxDev) return p;
    // Pull back: place point at maxDev distance from polyline, toward original point
    const ratio = maxDev / minD;
    return [
      closest[0] + ratio * (p[0] - closest[0]),
      closest[1] + ratio * (p[1] - closest[1]),
    ];
  });
}

// Project point p onto line segment a-b, return closest point on segment
function projectToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx*dx + dy*dy;
  if (len2 < 1e-18) return a;
  const t = Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2));
  return [a[0] + t*dx, a[1] + t*dy];
}

// Bearing from point a to point b in degrees [0, 360)
function bearing(a, b) {
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function haversineNm(lat1, lon1, lat2, lon2) {
  const R = 3440.065;
  const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
