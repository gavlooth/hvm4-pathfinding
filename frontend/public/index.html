<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maritime Router — Aegean Sea</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; }
    #map { width: 100vw; height: 65vh; }
    #panel { padding: 12px 24px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    #status { flex: 1; min-width: 220px; }
    #status h2 { color: #4fc3f7; margin-bottom: 6px; font-size: 17px; }
    #status .info { font-size: 13px; line-height: 1.7; color: #aaa; }
    #status .info b { color: #e0e0e0; }
    #controls { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
    #controls label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    #controls select, #controls button, #controls input {
      padding: 7px 12px; border: 1px solid #333; border-radius: 5px;
      background: #1a1a2e; color: #e0e0e0; font-size: 13px; cursor: pointer;
    }
    #controls input { cursor: text; width: 100%; }
    #controls select:focus, #controls input:focus { border-color: #4fc3f7; outline: none; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; }
    #btn-route { background: #e94560; border-color: #e94560; font-weight: 600; }
    #btn-route:hover { background: #c73850; }
    #btn-route:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-cancel { background: #333; border-color: #555; font-weight: 600; display: none; }
    #btn-cancel:hover { background: #555; }
    #log { flex: 1; min-width: 200px; font-size: 12px; color: #666; max-height: 120px; overflow-y: auto; font-family: monospace; line-height: 1.6; }
    #log .ok { color: #4caf50; }
    #log .err { color: #e94560; }
    #log .warn { color: #ffb74d; }
    #wp-table { max-height: 30vh; overflow-y: auto; width: 100%; padding: 0 24px 16px; }
    #wp-table table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: monospace; }
    #wp-table th { position: sticky; top: 0; background: #0a0a1a; color: #4fc3f7; text-align: left; padding: 4px 8px; border-bottom: 1px solid #333; }
    #wp-table td { padding: 3px 8px; border-bottom: 1px solid #1a1a2e; }
    #wp-table tr:hover td { background: #1a1a2e; }
    .algo-desc { font-size: 11px; color: #555; margin-top: 2px; min-height: 28px; line-height: 1.4; }
    .timeout-row { display: flex; align-items: center; gap: 6px; }
    .timeout-row input { width: 50px; text-align: center; padding: 5px 4px; }
    .timeout-row span { font-size: 12px; color: #666; }
    .elapsed { font-size: 12px; color: #ffb74d; font-family: monospace; min-height: 18px; }
    .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .weather-grid input { width: 100%; text-align: center; padding: 5px 4px; }
    .weather-grid .wlabel { font-size: 10px; color: #555; text-align: center; }
    .reroute-row { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; }
    .reroute-row input[type="checkbox"] { width: auto; cursor: pointer; }
    .reroute-row input[type="number"] { width: 48px; text-align: center; padding: 4px 2px; }
    .reroute-row span { white-space: nowrap; }
    #countdown { color: #ffb74d; font-family: monospace; font-size: 13px; }
    .comparison { font-size: 12px; line-height: 1.6; margin-top: 6px; padding: 6px 8px; background: #111122; border-radius: 4px; border-left: 3px solid #e94560; }
    .comparison .calm { color: #4fc3f7; }
    .comparison .weather { color: #e94560; }
    .comparison .penalty { color: #ffb74d; }
    .legend-control { background: rgba(10,10,26,0.85); padding: 8px 10px; border-radius: 5px; font-size: 11px; line-height: 1.8; color: #ccc; }
    .legend-control i { display: inline-block; width: 20px; height: 3px; vertical-align: middle; margin-right: 5px; }
    /* Ship animation bar */
    #anim-bar { background: #111122; padding: 8px 24px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #1a1a2e; }
    .anim-controls { display: flex; align-items: center; gap: 6px; }
    .anim-controls button { background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; width: 32px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .anim-controls button:hover { border-color: #4fc3f7; }
    .anim-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .anim-controls select { padding: 4px 8px; border: 1px solid #333; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; font-size: 12px; cursor: pointer; }
    #anim-scrubber { flex: 1; accent-color: #e94560; height: 4px; cursor: pointer; }
    #anim-time { font-family: monospace; font-size: 12px; color: #aaa; min-width: 150px; text-align: right; }
    .anim-bottom { display: flex; align-items: center; gap: 12px; }
    #anim-data { display: flex; gap: 14px; font-size: 11px; font-family: monospace; color: #888; flex-wrap: wrap; flex: 1; }
    #anim-data b { color: #aaa; font-weight: normal; }
    #anim-data .val { color: #4fc3f7; }
    .ship-icon { background: none !important; border: none !important; }

    .ship-arrow { width: 24px; height: 24px; transition: transform 0.15s linear; }
    #btn-reroute-from { background: none; border: 1px solid #555; color: #aaa; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap; }
    #btn-reroute-from:hover:not(:disabled) { border-color: #e94560; color: #e94560; }
    #btn-reroute-from:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="anim-bar" style="display:none">
    <div class="anim-controls">
      <button onclick="animPlay()" id="btn-aplay" title="Play">&#9654;</button>
      <button onclick="animPause()" id="btn-apause" title="Pause" style="display:none">&#10074;&#10074;</button>
      <button onclick="animStop()" id="btn-astop" title="Stop">&#9632;</button>
      <button onclick="animRestart()" id="btn-arestart" title="Restart">&#9194;</button>
      <span class="anim-label">Speed</span>
      <select id="anim-speed" onchange="animSpeedMul=+this.value">
        <option value="50">50&times;</option>
        <option value="100" selected>100&times;</option>
        <option value="500">500&times;</option>
        <option value="1000">1000&times;</option>
        <option value="3600">3600&times;</option>
      </select>
      <input type="range" id="anim-scrubber" min="0" max="10000" value="0" step="1" oninput="onAnimScrub(+this.value)">
      <span id="anim-time">0:00 / 0:00</span>
    </div>
    <div class="anim-bottom">
      <div id="anim-data"></div>
      <button id="btn-reroute-from" onclick="rerouteFromShip()" disabled>&#8635; Re-route from here</button>
    </div>
  </div>
  <div id="panel">
    <div id="status">
      <h2>Maritime Router</h2>
      <div class="info" id="info">Select a route and algorithm, then click "Route".</div>
    </div>
    <div id="controls">
      <label>Route</label>
      <select id="route-select">
        <option value="37.9475,23.6378,37.4467,25.3289" selected>Piraeus - Mykonos</option>
        <option value="37.9475,23.6378,36.3932,25.4615">Piraeus - Santorini</option>
        <option value="37.9475,23.6378,35.3387,25.1442">Piraeus - Heraklion</option>
        <option value="40.6401,22.9444,38.3722,26.1367">Thessaloniki - Chios</option>
        <option value="39.3666,22.9425,39.1622,23.4903">Volos - Skiathos</option>
        <option value="36.4510,28.2278,37.9475,23.6378">Rhodes - Piraeus</option>
        <option value="40.9397,24.4014,39.8742,25.0636">Kavala - Limnos</option>
        <option value="38.2466,21.7346,39.6243,19.9217">Patras - Corfu</option>
      </select>
      <label>Algorithm</label>
      <select id="algo" disabled onchange="onAlgoChange()">
        <option value="c3_dijkstra" selected>Dijkstra (C3)</option>
        <option value="vine_dijkstra">Dijkstra (Vine)</option>
        <option value="vine_delta_stepping">Delta-Stepping (Vine, parallel)</option>
      </select>
      <label>Smoothing</label>
      <select id="smoothing" onchange="onSmoothingChange()">
        <option value="none">None (raw waypoints)</option>
        <option value="chaikin" selected>Chaikin corner cutting</option>
        <option value="bezier">Cubic B&eacute;zier spline</option>
        <option value="heading">Heading-rate limiting</option>
      </select>
      <label>Weather</label>
      <div class="weather-grid">
        <div><div class="wlabel">Wind (m/s)</div><input type="number" id="wind-speed" value="0" min="0" max="40" step="0.5"></div>
        <div><div class="wlabel">Wind dir (&deg;)</div><input type="number" id="wind-dir" value="0" min="0" max="360" step="5"></div>
        <div><div class="wlabel">Current (m/s)</div><input type="number" id="current-speed" value="0" min="0" max="5" step="0.1"></div>
        <div><div class="wlabel">Current dir (&deg;)</div><input type="number" id="current-dir" value="0" min="0" max="360" step="5"></div>
      </div>
      <label>Timeout</label>
      <div class="timeout-row">
        <input type="number" id="timeout" value="30" min="5" max="300" step="5">
        <span>seconds</span>
      </div>
      <label>Dynamic routing</label>
      <div class="reroute-row">
        <input type="checkbox" id="auto-reroute">
        <span>Re-route every</span>
        <input type="number" id="reroute-interval" value="180" min="1" max="720">
        <span>min</span>
        <span id="countdown">&mdash;</span>
      </div>
      <div class="elapsed" id="elapsed"></div>
      <div class="btn-row">
        <button id="btn-route" onclick="runPipeline()">Route</button>
        <button id="btn-cancel" onclick="cancelPipeline()">Cancel</button>
      </div>
    </div>
    <div id="log"></div>
  </div>
  <div id="wp-table"></div>

<script>
const API = location.origin;
let map, routeLine, markers = [];
let abortCtrl = null;
let elapsedTimer = null;
let bgLine = null;
let calmLine = null;
let lastTimestamp = '';
let countdownTimer = null;
let countdownEnd = null;

const ALGO_INFO = {
  'c3_dijkstra': { name: 'Dijkstra (C3)', desc: 'Fibonacci heap Dijkstra in C3.' },
  'vine_dijkstra': { name: 'Dijkstra (Vine)', desc: 'Map-based Dijkstra on IVM runtime.' },
  'vine_delta_stepping': { name: 'Delta-Stepping (Vine)', desc: 'Parallel bucket SSSP — atomic dist/prev in Rust, tree-parallel relaxation. 53x faster than Vine Dijkstra.' },
};

function onSmoothingChange() {
  if (lastRoute) {
    displayRoute(lastRoute);
    updateInfo(lastRoute, lastAlg, lastMs);
  }
}

function onAlgoChange() {
  const alg = document.getElementById('algo').value;
  const isVine = alg.startsWith('vine_');
  // Show/hide weather inputs based on algorithm type
  document.querySelectorAll('.weather-grid input').forEach(el => {
    el.disabled = !isVine;
    el.style.opacity = isVine ? '1' : '0.4';
  });
}

let lastRoute = null, lastAlg = '', lastMs = 0;

// --- Map setup ---
map = L.map('map').setView([37.8, 24.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

// --- Legend ---
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend-control');
  div.innerHTML =
    '<b>Route Legend</b><br>' +
    '<i style="background:#e94560"></i> Weather route<br>' +
    '<i style="background:#4fc3f7;border-top:2px dashed #4fc3f7;height:0"></i> Calm reference<br>' +
    '<b style="font-size:10px;letter-spacing:0.3px">Wind speed:</b><br>' +
    '<i style="background:rgb(150,210,255)"></i> 0-5 kt calm<br>' +
    '<i style="background:rgb(80,200,140)"></i> 10-15 kt moderate<br>' +
    '<i style="background:rgb(255,200,30)"></i> 25 kt strong<br>' +
    '<i style="background:rgb(230,50,50)"></i> 40+ kt storm';
  return div;
};
legend.addTo(map);

// --- Logging ---
function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls || ''}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// --- Elapsed timer ---
function startElapsed() {
  const start = performance.now();
  const el = document.getElementById('elapsed');
  el.textContent = '0.0s';
  elapsedTimer = setInterval(() => {
    const s = ((performance.now() - start) / 1000).toFixed(1);
    el.textContent = `${s}s elapsed`;
  }, 100);
}

function stopElapsed() {
  clearInterval(elapsedTimer);
  elapsedTimer = null;
}

// --- API helpers ---
async function post(path, body, signal) {
  const res = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal,
  });
  if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);
  return res.json();
}

// --- Cancel ---
function cancelPipeline() {
  if (abortCtrl) {
    abortCtrl.abort();
    log('Cancelled by user', 'warn');
  }
}

function setRunning(running) {
  document.getElementById('btn-route').style.display = running ? 'none' : '';
  document.getElementById('btn-cancel').style.display = running ? '' : 'none';
  document.getElementById('route-select').disabled = running;
  document.getElementById('algo').disabled = running;
  document.getElementById('timeout').disabled = running;
}

// --- Pipeline ---
async function runPipeline(overrideOrigin) {
  setRunning(true);
  stopAnimationCleanup();
  document.getElementById('anim-bar').style.display = 'none';
  document.getElementById('log').innerHTML = '';
  document.getElementById('wp-table').innerHTML = '';
  document.getElementById('elapsed').textContent = '';

  abortCtrl = new AbortController();
  const signal = abortCtrl.signal;
  const alg = document.getElementById('algo').value;
  const isVine = alg.startsWith('vine_');
  const userTimeout = parseInt(document.getElementById('timeout').value) || 30;
  const timeoutSec = isVine ? Math.max(userTimeout, 120) : userTimeout;

  // Auto-abort after timeout
  const timeoutId = setTimeout(() => {
    if (abortCtrl) {
      abortCtrl.abort();
      log(`Timeout: algorithm exceeded ${timeoutSec}s limit`, 'err');
    }
  }, timeoutSec * 1000);

  try {
    const sel = document.getElementById('route-select').value.split(',').map(Number);
    const origin = overrideOrigin || [sel[0], sel[1]], dest = [sel[2], sel[3]];
    // 1. Init
    log('Initializing with H3 graph...');
    const t0 = performance.now();
    const init = await post('/api/init', { ship_speed: 15, max_wave: 4, graph_mode: 'h3' }, signal);
    log(`Initialized: ${init.node_count} nodes (${(performance.now()-t0)|0} ms)`, 'ok');

    // 2. Voyage
    const routeName = document.getElementById('route-select').selectedOptions[0].text;
    log(`Voyage: ${routeName}`);
    await post('/api/voyage', { origin, destination: dest }, signal);

    // 3. Weather (only for C3 algorithms)
    if (!isVine) {
      const n = 25;
      const wxBase = {
        sw: [34.5, 19.0], ne: [41.5, 30.0], rows: 5, cols: 5,
        wind_speed: Array(n).fill(3), wind_dir: Array(n).fill(180),
        wave_height: Array(n).fill(0.5), wave_dir: Array(n).fill(180),
        current_speed: Array(n).fill(0.2), current_dir: Array(n).fill(90),
      };
      await post('/api/weather', { ...wxBase, timestamp: 0 }, signal);
      log('Weather pushed', 'ok');
    }

    // 4. Route
    const algName = ALGO_INFO[alg]?.name || alg;
    log(`Routing with ${algName}... (timeout: ${timeoutSec}s)${isVine ? ' [IVM]' : ''}`);
    startElapsed();
    const t1 = performance.now();

    let route;
    if (isVine) {
      const vineAlgo = alg.replace('vine_', '');
      const wxParams = {
        wind_speed: parseFloat(document.getElementById('wind-speed').value) || 0,
        wind_dir: parseFloat(document.getElementById('wind-dir').value) || 0,
        current_speed: parseFloat(document.getElementById('current-speed').value) || 0,
        current_dir: parseFloat(document.getElementById('current-dir').value) || 0,
      };
      route = await post('/api/vine/route', {
        algorithm: vineAlgo, workers: 4, origin, destination: dest, ...wxParams
      }, signal);
    } else {
      route = await post('/api/route', { algorithm: 0 }, signal);
    }
    stopElapsed();
    const ms = (performance.now()-t1)|0;
    document.getElementById('elapsed').textContent = `${(ms/1000).toFixed(1)}s`;
    log(`Route: cost=${route.cost} (${route.cost_real.toFixed(1)} h), ${route.path_length} wp, ${ms} ms`, 'ok');
    if (route.calm_route) {
      log(`Calm ref: cost=${route.calm_route.cost} (${route.calm_route.cost_real.toFixed(1)} h), ${route.calm_route.path_length} wp`, 'ok');
    }

    lastRoute = route;
    lastAlg = algName;
    lastMs = ms;
    if (route.timestamp) lastTimestamp = route.timestamp;
    displayRoute(route);
    updateInfo(route, algName, ms);
    startCountdown();
    initAnimation(route);

  } catch (e) {
    stopElapsed();
    if (e.name === 'AbortError') {
      log('Request aborted', 'warn');
    } else {
      log(`Error: ${e.message}`, 'err');
      console.error(e);
    }
  } finally {
    clearTimeout(timeoutId);
    abortCtrl = null;
    setRunning(false);
  }
}

// ============================================================
// Weather corridor — OWM-style gradient canvas overlay
// ============================================================
// Single canvas layer draws a continuous colour-coded band along
// the route.  Per-segment colour follows the OpenWeatherMap wind
// speed palette.  Two passes (border + fill) with round lineJoin
// give clean edges without overlap circles.

let weatherLayer = null;

// OWM wind speed colour stops [knots, r, g, b]
const OWM_STOPS = [
  [  0, 150, 210, 255],   // light blue — calm
  [  5,  80, 190, 230],   // cyan
  [ 10,  80, 200, 140],   // teal-green
  [ 15, 130, 210,  60],   // green
  [ 20, 210, 210,  30],   // yellow-green
  [ 25, 255, 200,  30],   // gold
  [ 30, 255, 150,  30],   // orange
  [ 35, 255,  90,  30],   // dark orange
  [ 40, 230,  50,  50],   // red
  [ 50, 180,  30, 120],   // magenta
  [ 60, 120,  20, 140],   // purple
];

function owmRGB(kt) {
  if (kt <= OWM_STOPS[0][0]) return OWM_STOPS[0].slice(1);
  for (let i = 1; i < OWM_STOPS.length; i++) {
    if (kt <= OWM_STOPS[i][0]) {
      const [k0, r0, g0, b0] = OWM_STOPS[i - 1];
      const [k1, r1, g1, b1] = OWM_STOPS[i];
      const t = (kt - k0) / (k1 - k0);
      return [
        Math.round(r0 + t * (r1 - r0)),
        Math.round(g0 + t * (g1 - g0)),
        Math.round(b0 + t * (b1 - b0)),
      ];
    }
  }
  return OWM_STOPS[OWM_STOPS.length - 1].slice(1);
}

const WeatherCorridor = L.Layer.extend({
  initialize(wps) { this._wps = wps; },

  onAdd(map) {
    this._map = map;
    this._canvas = L.DomUtil.create('canvas', 'weather-corridor');
    this._canvas.style.position = 'absolute';
    this._canvas.style.pointerEvents = 'none';
    this._canvas.style.zIndex = '350';
    map.getPanes().overlayPane.appendChild(this._canvas);
    map.on('moveend zoomend resize', this._redraw, this);
    this._redraw();
  },

  onRemove(map) {
    map.getPanes().overlayPane.removeChild(this._canvas);
    map.off('moveend zoomend resize', this._redraw, this);
  },

  _redraw() {
    const map = this._map, size = map.getSize();
    const topLeft = map.containerPointToLayerPoint([0, 0]);
    L.DomUtil.setPosition(this._canvas, topLeft);
    this._canvas.width = size.x;
    this._canvas.height = size.y;
    const ctx = this._canvas.getContext('2d');
    ctx.clearRect(0, 0, size.x, size.y);

    const wps = this._wps;
    if (!wps || wps.length < 2) return;

    // Convert to screen coordinates + per-point wind
    const pts = wps.map(w => {
      const p = map.latLngToContainerPoint([w.lat, w.lon]);
      return { x: p.x, y: p.y, wind: w.wind_speed || 0 };
    });

    // Pass 1: border (wider, darker, more opaque)
    this._drawPass(ctx, pts, 48, 0.35, 0.55);
    // Pass 2: fill (narrower, lighter)
    this._drawPass(ctx, pts, 40, 0.28, 1.0);
  },

  _drawPass(ctx, pts, width, alpha, brighten) {
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Draw each segment individually so stroke colour can vary,
    // but use moveTo/lineTo within a single begin/stroke per colour
    // to avoid gaps.  Group consecutive same-colour segments.
    let prevColor = '';
    for (let i = 0; i < pts.length - 1; i++) {
      const avgWind = (pts[i].wind + pts[i + 1].wind) / 2;
      const [r, g, b] = owmRGB(avgWind);
      const br = Math.min(255, Math.round(r * brighten));
      const bg = Math.min(255, Math.round(g * brighten));
      const bb = Math.min(255, Math.round(b * brighten));
      const col = `rgba(${br},${bg},${bb},${alpha})`;

      if (col !== prevColor) {
        if (prevColor) ctx.stroke();  // flush previous colour
        ctx.beginPath();
        ctx.strokeStyle = col;
        ctx.moveTo(pts[i].x, pts[i].y);
        prevColor = col;
      } else if (i === 0) {
        ctx.beginPath();
        ctx.strokeStyle = col;
        ctx.moveTo(pts[i].x, pts[i].y);
        prevColor = col;
      }
      ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
    }
    if (prevColor) ctx.stroke();
  },
});

function addWeatherCorridor(wps) {
  removeWeatherCorridor();
  if (!wps || wps.length < 2) return;
  weatherLayer = new WeatherCorridor(wps);
  weatherLayer.addTo(map);
}

function removeWeatherCorridor() {
  if (weatherLayer) { map.removeLayer(weatherLayer); weatherLayer = null; }
}

function displayRoute(route) {
  if (routeLine) map.removeLayer(routeLine);
  if (bgLine) map.removeLayer(bgLine);
  if (calmLine) map.removeLayer(calmLine);
  removeWeatherCorridor();
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  bgLine = null;
  calmLine = null;

  const wps = route.waypoints;
  if (!wps || !wps.length) return;

  const method = document.getElementById('smoothing').value;
  const rawLatLngs = wps.map(w => [w.lat, w.lon]);
  const smoothed = smoothRoute(rawLatLngs, method);
  const isSmoothed = method !== 'none';

  // Draw calm reference route (dashed light-blue) if available
  if (route.calm_route && route.calm_route.waypoints && route.calm_route.waypoints.length) {
    const calmLatLngs = route.calm_route.waypoints.map(w => [w.lat, w.lon]);
    const calmSmoothed = smoothRoute(calmLatLngs, method);
    calmLine = L.polyline(calmSmoothed, {
      color: '#4fc3f7', weight: 2, opacity: 0.5, dashArray: '6,4', smoothFactor: 1,
    }).addTo(map);
  }

  // Draw raw route as faint background when smoothing is active
  if (isSmoothed) {
    bgLine = L.polyline(rawLatLngs, { color: '#e94560', weight: 1, opacity: 0.15, dashArray: '3,3' }).addTo(map);
  }

  // Draw weather (or main) route — solid red
  routeLine = L.polyline(smoothed, { color: '#e94560', weight: 3, opacity: 0.9, smoothFactor: 1 }).addTo(map);

  // Weather corridor — wind barbs + wave shading in wide band around route
  addWeatherCorridor(wps);

  // Timestamp for popups
  const ts = lastTimestamp ? new Date(lastTimestamp).toLocaleTimeString() : '';

  // Markers on weather route waypoints
  wps.forEach((wp, i) => {
    const isEnd = (i === 0 || i === wps.length - 1);
    const m = L.circleMarker([wp.lat, wp.lon], {
      radius: isEnd ? 7 : 3,
      fillColor: isEnd ? '#e94560' : '#4fc3f7',
      fillOpacity: isEnd ? 1 : 0.6,
      color: '#fff',
      weight: isEnd ? 2 : 1,
    }).addTo(map);
    const tsLine = ts ? `<br><span style="color:#888">Updated: ${ts}</span>` : '';
    m.bindPopup(`<b>${i === 0 ? 'Origin' : i === wps.length-1 ? 'Destination' : 'WP ' + i}</b><br>
      Node ${wp.node_id}<br>
      ${wp.lat.toFixed(4)}, ${wp.lon.toFixed(4)}<br>
      ETA: ${wp.eta_hours.toFixed(1)} h | ${wp.speed_knots.toFixed(1)} kt<br>
      Wave: ${wp.wave_height.toFixed(1)} m | Wind: ${wp.wind_speed.toFixed(1)} kt<br>
      Hdg: ${wp.heading_deg.toFixed(0)}&deg;${tsLine}`);
    markers.push(m);
  });

  map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
}

function updateInfo(route, alg, ms) {
  const wps = route.waypoints;

  let totalDist = 0;
  for (let i = 1; i < wps.length; i++) {
    totalDist += haversineNm(wps[i-1].lat, wps[i-1].lon, wps[i].lat, wps[i].lon);
  }

  const method = document.getElementById('smoothing').value;
  const smoothLabel = method === 'none' ? '' : ` + ${method}`;
  const costUnit = 'hours';

  let infoHtml =
    `<b>Algorithm:</b> ${alg} (${ms} ms)<br>` +
    `<b>Cost:</b> ${route.cost} (${route.cost_real.toFixed(2)} ${costUnit})<br>` +
    `<b>Waypoints:</b> ${wps.length}${smoothLabel}<br>` +
    `<b>Distance:</b> ~${totalDist.toFixed(1)} nm`;

  // Dual-route comparison
  if (route.calm_route) {
    const wxCost = route.cost_real;
    const calmCost = route.calm_route.cost_real;
    const penalty = calmCost > 0 ? ((wxCost - calmCost) / calmCost * 100) : 0;
    const sign = penalty >= 0 ? '+' : '';
    infoHtml += `<div class="comparison">` +
      `<span class="weather">Weather Route:</span> ${wxCost.toFixed(1)} h (cost ${route.cost})<br>` +
      `<span class="calm">Calm Route:</span> ${calmCost.toFixed(1)} h (cost ${route.calm_route.cost})<br>` +
      `<span class="penalty">Penalty: ${sign}${penalty.toFixed(1)}%` +
      (penalty !== 0 ? ` (weather ${penalty > 0 ? 'adds' : 'saves'} ${Math.abs(wxCost - calmCost).toFixed(1)} h)` : ' (no difference)') +
      `</span></div>`;
  }

  if (lastTimestamp) {
    infoHtml += `<br><span style="color:#666;font-size:11px">Updated: ${new Date(lastTimestamp).toLocaleString()}</span>`;
  }

  document.getElementById('info').innerHTML = infoHtml;

  let html = '<table><tr><th>#</th><th>Lat</th><th>Lon</th><th>ETA</th><th>Speed</th><th>Wave</th><th>Wind</th><th>Hdg</th><th>Node</th></tr>';
  wps.forEach((wp, i) => {
    html += `<tr>
      <td>${i+1}</td><td>${wp.lat.toFixed(4)}</td><td>${wp.lon.toFixed(4)}</td>
      <td>${wp.eta_hours.toFixed(1)}h</td><td>${wp.speed_knots.toFixed(1)}kt</td>
      <td>${wp.wave_height.toFixed(1)}m</td><td>${wp.wind_speed.toFixed(1)}</td>
      <td>${wp.heading_deg.toFixed(0)}&deg;</td><td>${wp.node_id}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('wp-table').innerHTML = html;
}

// ============================================================
// Smoothing algorithms
// ============================================================

function smoothRoute(pts, method) {
  if (pts.length < 3 || method === 'none') return pts;
  switch (method) {
    case 'chaikin':  return chaikinSmooth(pts, 3);
    case 'bezier':   return catmullRomSpline(pts, 8, 0.5);
    case 'heading':  return headingRateSmooth(pts, 15);
    default:         return pts;
  }
}

// --- Chaikin corner cutting (land-constrained) ---
// Each iteration replaces interior segments with 25%/75% splits.
// After smoothing, each point is clamped so it cannot deviate more
// than maxDev from the nearest segment of the original polyline.
function chaikinSmooth(pts, iterations, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  let points = pts.slice();
  for (let iter = 0; iter < iterations; iter++) {
    const next = [points[0]];
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      if (i === 0) {
        next.push(a);
        next.push([0.5 * a[0] + 0.5 * b[0], 0.5 * a[1] + 0.5 * b[1]]);
      } else if (i === points.length - 2) {
        next.push([0.5 * a[0] + 0.5 * b[0], 0.5 * a[1] + 0.5 * b[1]]);
        next.push(b);
      } else {
        next.push([0.75 * a[0] + 0.25 * b[0], 0.75 * a[1] + 0.25 * b[1]]);
        next.push([0.25 * a[0] + 0.75 * b[0], 0.25 * a[1] + 0.75 * b[1]]);
      }
    }
    next.push(points[points.length - 1]);
    points = next;
  }
  // Clamp: pull back any point that drifts too far from the original polyline
  return clampToPolyline(points, pts, maxDev);
}

// --- Catmull-Rom cubic spline (land-constrained) ---
// Passes through all original waypoints with smooth C1 continuity.
// Per-segment deviation is clamped so the spline cannot swing far
// from the original polyline (prevents cutting through islands).
// maxDev: absolute max deviation in degrees (~0.015 deg ≈ 1.7 km).
// Also capped at 20% of chord length so short coastal hops stay tight.
function catmullRomSpline(pts, samplesPerSeg, tension, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  const n = pts.length;
  if (n < 2) return pts;
  const result = [];

  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(n - 1, i + 2)];

    const chordLen = Math.sqrt((p2[0]-p1[0])**2 + (p2[1]-p1[1])**2);
    const segMaxDev = Math.min(maxDev, chordLen * 0.2);

    // Binary search for safe tension: start at full, halve until deviation fits
    let safeTension = tension;
    let segPoints = null;

    for (let attempt = 0; attempt < 6; attempt++) {
      segPoints = hermiteSegment(p0, p1, p2, p3, safeTension, samplesPerSeg);
      const dev = maxChordDeviation(segPoints, p1, p2);
      if (dev <= segMaxDev || safeTension < 0.01) break;
      safeTension *= 0.5;
    }

    // Append segment points (excluding last to avoid duplicates)
    for (let s = 0; s < segPoints.length - 1; s++) {
      result.push(segPoints[s]);
    }
  }
  result.push(pts[n - 1]);
  return result;
}

// Generate Hermite spline points for one segment
function hermiteSegment(p0, p1, p2, p3, t, steps) {
  const m1lat = t * (p2[0] - p0[0]);
  const m1lon = t * (p2[1] - p0[1]);
  const m2lat = t * (p3[0] - p1[0]);
  const m2lon = t * (p3[1] - p1[1]);
  const pts = [];
  for (let s = 0; s <= steps; s++) {
    const u = s / steps;
    const u2 = u * u, u3 = u2 * u;
    const h00 = 2*u3 - 3*u2 + 1;
    const h10 = u3 - 2*u2 + u;
    const h01 = -2*u3 + 3*u2;
    const h11 = u3 - u2;
    pts.push([
      h00*p1[0] + h10*m1lat + h01*p2[0] + h11*m2lat,
      h00*p1[1] + h10*m1lon + h01*p2[1] + h11*m2lon,
    ]);
  }
  return pts;
}

// Max perpendicular distance from any point in pts to the chord a-b
function maxChordDeviation(pts, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx*dx + dy*dy;
  let maxD = 0;
  for (const p of pts) {
    let d;
    if (len2 < 1e-18) {
      d = Math.sqrt((p[0]-a[0])**2 + (p[1]-a[1])**2);
    } else {
      const t = Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2));
      const proj = [a[0] + t*dx, a[1] + t*dy];
      d = Math.sqrt((p[0]-proj[0])**2 + (p[1]-proj[1])**2);
    }
    if (d > maxD) maxD = d;
  }
  return maxD;
}

// --- Heading-rate smoothing (land-constrained) ---
// Maritime-specific: limits the rate of heading change per step.
// Sharp turns are replaced with smooth arcs using quadratic Bezier
// interpolation around the corner waypoint. Final result clamped
// to stay near the original polyline.
function headingRateSmooth(pts, maxTurnDeg, maxDev) {
  if (maxDev === undefined) maxDev = 0.015;
  const n = pts.length;
  if (n < 3) return pts;
  const result = [pts[0]];

  for (let i = 1; i < n - 1; i++) {
    const prev = pts[i - 1];
    const curr = pts[i];
    const next = pts[i + 1];

    const hdg1 = bearing(prev, curr);
    const hdg2 = bearing(curr, next);
    let turn = hdg2 - hdg1;
    while (turn > 180) turn -= 360;
    while (turn < -180) turn += 360;

    if (Math.abs(turn) <= maxTurnDeg) {
      result.push(curr);
    } else {
      const nSteps = Math.max(3, Math.ceil(Math.abs(turn) / maxTurnDeg));
      const pullback = 0.3;
      const dPrev = Math.sqrt((curr[0]-prev[0])**2 + (curr[1]-prev[1])**2);
      const dNext = Math.sqrt((next[0]-curr[0])**2 + (next[1]-curr[1])**2);
      const rPrev = Math.min(pullback, 0.5 * dPrev / Math.max(dPrev, 1e-9));
      const rNext = Math.min(pullback, 0.5 * dNext / Math.max(dNext, 1e-9));
      const arcStart = [
        curr[0] - rPrev * (curr[0] - prev[0]),
        curr[1] - rPrev * (curr[1] - prev[1]),
      ];
      const arcEnd = [
        curr[0] + rNext * (next[0] - curr[0]),
        curr[1] + rNext * (next[1] - curr[1]),
      ];
      result.push(arcStart);
      for (let s = 1; s < nSteps; s++) {
        const t = s / nSteps;
        const omt = 1 - t;
        result.push([
          omt*omt*arcStart[0] + 2*omt*t*curr[0] + t*t*arcEnd[0],
          omt*omt*arcStart[1] + 2*omt*t*curr[1] + t*t*arcEnd[1],
        ]);
      }
      result.push(arcEnd);
    }
  }
  result.push(pts[n - 1]);
  return clampToPolyline(result, pts, maxDev);
}

// --- Land-avoidance: clamp smoothed points to original polyline ---
// For each smoothed point, find the closest point on the original polyline.
// If distance exceeds maxDev, pull the point back toward the polyline.
function clampToPolyline(smoothed, original, maxDev) {
  return smoothed.map(p => {
    let minD = Infinity, closest = p;
    for (let j = 0; j < original.length - 1; j++) {
      const a = original[j], b = original[j + 1];
      const proj = projectToSegment(p, a, b);
      const d = Math.sqrt((p[0]-proj[0])**2 + (p[1]-proj[1])**2);
      if (d < minD) { minD = d; closest = proj; }
    }
    if (minD <= maxDev) return p;
    // Pull back: place point at maxDev distance from polyline, toward original point
    const ratio = maxDev / minD;
    return [
      closest[0] + ratio * (p[0] - closest[0]),
      closest[1] + ratio * (p[1] - closest[1]),
    ];
  });
}

// Project point p onto line segment a-b, return closest point on segment
function projectToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx*dx + dy*dy;
  if (len2 < 1e-18) return a;
  const t = Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / len2));
  return [a[0] + t*dx, a[1] + t*dy];
}

// Bearing from point a to point b in degrees [0, 360)
function bearing(a, b) {
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function haversineNm(lat1, lon1, lat2, lon2) {
  const R = 3440.065;
  const dLat = (lat2-lat1) * Math.PI/180, dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// ============================================================
// Countdown timer for dynamic re-routing
// ============================================================

function startCountdown() {
  stopCountdown();
  const cb = document.getElementById('auto-reroute');
  if (!cb.checked) {
    document.getElementById('countdown').textContent = '\u2014';
    return;
  }
  const minutes = parseInt(document.getElementById('reroute-interval').value) || 180;
  countdownEnd = Date.now() + minutes * 60 * 1000;
  tickCountdown();
  countdownTimer = setInterval(tickCountdown, 1000);
}

function tickCountdown() {
  const el = document.getElementById('countdown');
  const remaining = Math.max(0, countdownEnd - Date.now());
  if (remaining <= 0) {
    el.textContent = 'Re-routing...';
    stopCountdown();
    runPipeline();
    return;
  }
  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  el.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function stopCountdown() {
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

// Initialize weather input state
onAlgoChange();

document.getElementById('auto-reroute').addEventListener('change', function() {
  if (!this.checked) {
    stopCountdown();
    document.getElementById('countdown').textContent = '\u2014';
  } else if (lastRoute) {
    startCountdown();
  }
});

// ============================================================
// Ship Animation
// ============================================================

let animState = 'stopped';
let animTime = 0;
let animTotalTime = 0;
let animLastFrame = null;
let animSpeedMul = 100;
let animEdges = [];
let shipMarker = null;
let animRAF = null;
let animShipPos = null;
let traveledLine = null;

const SHIP_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="12,2 21,22 12,17 3,22" fill="#e94560" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';

function stopAnimationCleanup() {
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  animState = 'stopped';
  if (shipMarker) { map.removeLayer(shipMarker); shipMarker = null; }
  if (traveledLine) { map.removeLayer(traveledLine); traveledLine = null; }
  animShipPos = null;
}

function initAnimation(route) {
  stopAnimationCleanup();

  const wps = route.waypoints;
  if (!wps || wps.length < 2 || !wps[wps.length - 1].eta_hours) {
    document.getElementById('anim-bar').style.display = 'none';
    return;
  }

  // Apply the same smoothing to get the curve the ship follows
  const method = document.getElementById('smoothing').value;
  const rawLatLngs = wps.map(w => [w.lat, w.lon]);
  const smoothed = smoothRoute(rawLatLngs, method);

  // Build a cumulative-distance lookup on the raw waypoints for metadata interpolation
  const rawCumDist = [0];
  for (let i = 1; i < wps.length; i++) {
    rawCumDist.push(rawCumDist[i - 1] +
      haversineNm(wps[i - 1].lat, wps[i - 1].lon, wps[i].lat, wps[i].lon));
  }
  const rawTotalDist = rawCumDist[rawCumDist.length - 1] || 1;

  // For a smoothed point, find which raw segment it belongs to and interpolate metadata
  function metaAt(lat, lon) {
    // Find closest raw segment
    let bestSeg = 0, bestD = Infinity;
    for (let j = 0; j < wps.length - 1; j++) {
      const proj = projectToSegment([lat, lon], [wps[j].lat, wps[j].lon], [wps[j + 1].lat, wps[j + 1].lon]);
      const d = (lat - proj[0]) ** 2 + (lon - proj[1]) ** 2;
      if (d < bestD) { bestD = d; bestSeg = j; }
    }
    const a = wps[bestSeg], b = wps[bestSeg + 1];
    // Lerp factor along this raw segment
    const segDist = haversineNm(a.lat, a.lon, b.lat, b.lon) || 1;
    const ptDist = haversineNm(a.lat, a.lon, lat, lon);
    const f = Math.max(0, Math.min(1, ptDist / segDist));
    return {
      speed: a.speed_knots + f * (b.speed_knots - a.speed_knots),
      waveHeight: (a.wave_height || 0) + f * ((b.wave_height || 0) - (a.wave_height || 0)),
      windSpeed: (a.wind_speed || 0) + f * ((b.wind_speed || 0) - (a.wind_speed || 0)),
      eta: a.eta_hours + f * (b.eta_hours - a.eta_hours),
    };
  }

  // Build edge timeline from the smoothed polyline
  // First compute cumulative distance along smoothed path
  const sDist = [0];
  for (let i = 1; i < smoothed.length; i++) {
    sDist.push(sDist[i - 1] +
      haversineNm(smoothed[i - 1][0], smoothed[i - 1][1], smoothed[i][0], smoothed[i][1]));
  }
  const sTotalDist = sDist[sDist.length - 1] || 1;

  // Total voyage time from raw waypoints
  const totalTime = wps[wps.length - 1].eta_hours;

  // Assign ETA to each smoothed point proportionally by distance
  const sEta = smoothed.map((_, i) => (sDist[i] / sTotalDist) * totalTime);

  animEdges = [];
  for (let i = 0; i < smoothed.length - 1; i++) {
    const aLat = smoothed[i][0], aLon = smoothed[i][1];
    const bLat = smoothed[i + 1][0], bLon = smoothed[i + 1][1];
    const dt = sEta[i + 1] - sEta[i];
    const brg = bearing(smoothed[i], smoothed[i + 1]);
    const dist = haversineNm(aLat, aLon, bLat, bLon);
    const speed = dt > 0 ? dist / dt : 15;
    const meta = metaAt((aLat + bLat) / 2, (aLon + bLon) / 2);
    animEdges.push({
      idx: i,
      startTime: sEta[i],
      endTime: sEta[i + 1],
      duration: Math.max(dt, 0.00001),
      startLat: aLat, startLon: aLon,
      endLat: bLat, endLon: bLon,
      speed: meta.speed || speed,
      bearing: brg,
      distNm: dist,
      waveHeight: meta.waveHeight,
      windSpeed: meta.windSpeed,
    });
  }
  animTotalTime = totalTime;
  animTime = 0;
  animState = 'stopped';

  // Ship marker (arrow SVG, rotated by bearing)
  shipMarker = L.marker([smoothed[0][0], smoothed[0][1]], {
    icon: L.divIcon({
      className: 'ship-icon',
      html: '<div class="ship-arrow">' + SHIP_SVG + '</div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12],
    }),
    zIndexOffset: 1000,
  }).addTo(map);

  // Traveled path line (white overlay)
  traveledLine = L.polyline([], { color: '#fff', weight: 3, opacity: 0.6 }).addTo(map);

  document.getElementById('anim-bar').style.display = '';
  document.getElementById('anim-scrubber').value = 0;
  document.getElementById('btn-reroute-from').disabled = true;
  updateAnimData();
  updateAnimButtons();
}

function getPositionAtTime(t) {
  if (animEdges.length === 0) return null;
  t = Math.max(0, Math.min(t, animTotalTime));
  for (const e of animEdges) {
    if (t <= e.endTime) {
      const f = Math.max(0, Math.min(1, (t - e.startTime) / e.duration));
      return {
        lat: e.startLat + f * (e.endLat - e.startLat),
        lon: e.startLon + f * (e.endLon - e.startLon),
        speed: e.speed, bearing: e.bearing, edgeIdx: e.idx, frac: f,
        distNm: e.distNm, waveHeight: e.waveHeight, windSpeed: e.windSpeed,
      };
    }
  }
  const last = animEdges[animEdges.length - 1];
  return { lat: last.endLat, lon: last.endLon, speed: 0, bearing: last.bearing,
    edgeIdx: last.idx, frac: 1, distNm: 0, waveHeight: last.waveHeight, windSpeed: last.windSpeed };
}

function animPlay() {
  if (animEdges.length === 0) return;
  if (animTime >= animTotalTime) animTime = 0;
  animState = 'playing';
  animLastFrame = performance.now();
  document.getElementById('btn-reroute-from').disabled = true;
  updateAnimButtons();
  animTick();
}

function animPause() {
  animState = 'paused';
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  document.getElementById('btn-reroute-from').disabled = false;
  updateAnimButtons();
}

function animStop() {
  animState = 'stopped';
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
  animTime = 0;
  updateShipMarker();
  updateAnimData();
  updateAnimButtons();
  document.getElementById('btn-reroute-from').disabled = true;
}

function animRestart() {
  animTime = 0;
  if (animState === 'playing') {
    animLastFrame = performance.now();
  }
  updateShipMarker();
  updateAnimData();
}

function animTick() {
  if (animState !== 'playing') return;
  const now = performance.now();
  const dtSec = (now - animLastFrame) / 1000;
  animLastFrame = now;
  // Real seconds → simulation hours: dtSec * speedMul / 3600
  animTime += (dtSec * animSpeedMul) / 3600;
  if (animTime >= animTotalTime) {
    animTime = animTotalTime;
    animState = 'paused';
    document.getElementById('btn-reroute-from').disabled = false;
    updateAnimButtons();
  }
  updateShipMarker();
  updateAnimData();
  if (animState === 'playing') {
    animRAF = requestAnimationFrame(animTick);
  }
}

function updateShipMarker() {
  const pos = getPositionAtTime(animTime);
  if (!pos || !shipMarker) return;
  animShipPos = pos;
  shipMarker.setLatLng([pos.lat, pos.lon]);
  // Rotate arrow to match bearing
  const el = shipMarker.getElement();
  if (el) {
    const arrow = el.querySelector('.ship-arrow');
    if (arrow) arrow.style.transform = 'rotate(' + pos.bearing + 'deg)';
  }
  // Traveled path: start → all completed edge origins → current position
  if (traveledLine) {
    const pts = [];
    for (let i = 0; i <= pos.edgeIdx; i++) {
      pts.push([animEdges[i].startLat, animEdges[i].startLon]);
    }
    pts.push([pos.lat, pos.lon]);
    traveledLine.setLatLngs(pts);
  }
}

function updateAnimData() {
  const pos = getPositionAtTime(animTime);
  const scrubber = document.getElementById('anim-scrubber');
  const timeEl = document.getElementById('anim-time');
  const dataEl = document.getElementById('anim-data');
  if (!pos) {
    timeEl.textContent = '--:-- / --:--';
    dataEl.innerHTML = '';
    return;
  }
  scrubber.value = animTotalTime > 0 ? Math.round(animTime / animTotalTime * 10000) : 0;
  const el = formatHM(animTime);
  const tot = formatHM(animTotalTime);
  const rem = formatHM(Math.max(0, animTotalTime - animTime));
  timeEl.textContent = el + ' / ' + tot + '  -' + rem;
  dataEl.innerHTML =
    '<span><b>Pos</b> <span class="val">' + pos.lat.toFixed(4) + '\u00b0, ' + pos.lon.toFixed(4) + '\u00b0</span></span>' +
    '<span><b>Brg</b> <span class="val">' + pos.bearing.toFixed(0) + '\u00b0</span></span>' +
    '<span><b>Speed</b> <span class="val">' + pos.speed.toFixed(1) + ' kt</span></span>' +
    '<span><b>Wave</b> <span class="val">' + pos.waveHeight.toFixed(1) + ' m</span></span>' +
    '<span><b>Wind</b> <span class="val">' + pos.windSpeed.toFixed(1) + ' kt</span></span>' +
    '<span><b>Leg</b> <span class="val">' + (pos.edgeIdx + 1) + '/' + animEdges.length + '</span></span>';
}

function formatHM(hours) {
  if (!isFinite(hours) || hours < 0) return '0:00';
  const h = Math.floor(hours);
  const m = Math.floor((hours - h) * 60);
  return h + ':' + String(m).padStart(2, '0');
}

function onAnimScrub(val) {
  if (animState === 'playing') animPause();
  animTime = (val / 10000) * animTotalTime;
  updateShipMarker();
  updateAnimData();
  document.getElementById('btn-reroute-from').disabled = false;
}

function updateAnimButtons() {
  document.getElementById('btn-aplay').style.display = animState === 'playing' ? 'none' : '';
  document.getElementById('btn-apause').style.display = animState === 'playing' ? '' : 'none';
}

async function rerouteFromShip() {
  if (!animShipPos) return;
  const pos = [animShipPos.lat, animShipPos.lon];
  stopAnimationCleanup();
  document.getElementById('anim-bar').style.display = 'none';
  runPipeline(pos);
}
</script>
